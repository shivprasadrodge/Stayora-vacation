openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Stayora vacation rental marketplace and explainable recommendation research API.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: marketplace
    description: Property discovery and detail
  - name: recommendations
    description: Explainable personalized property recommendations
  - name: account
    description: User profile, preferences, wishlist, and bookings
  - name: hosting
    description: Host listing and booking management
  - name: admin
    description: Administration and research evaluation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /home:
    get:
      operationId: getHome
      tags: [marketplace]
      summary: Get homepage discovery content
      responses:
        "200":
          description: Homepage sections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeResponse"
  /destinations:
    get:
      operationId: getDestinations
      tags: [marketplace]
      summary: List popular destinations
      responses:
        "200":
          description: Popular destinations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Destination"
  /properties:
    get:
      operationId: getProperties
      tags: [marketplace]
      summary: Search and filter properties
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: city, in: query, schema: { type: string } }
        - { name: minPrice, in: query, schema: { type: number, minimum: 0 } }
        - { name: maxPrice, in: query, schema: { type: number, minimum: 0 } }
        - { name: propertyType, in: query, schema: { type: string } }
        - { name: bedrooms, in: query, schema: { type: integer, minimum: 0 } }
        - { name: bathrooms, in: query, schema: { type: integer, minimum: 0 } }
        - { name: amenities, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: guests, in: query, schema: { type: integer, minimum: 1 } }
        - { name: checkIn, in: query, schema: { type: string, format: date } }
        - { name: checkOut, in: query, schema: { type: string, format: date } }
        - { name: sort, in: query, schema: { type: string, enum: [relevance, price_asc, price_desc, rating] } }
      responses:
        "200":
          description: Matching properties and result count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertySearchResponse"
  /properties/{propertyId}:
    get:
      operationId: getProperty
      tags: [marketplace]
      summary: Get property details
      parameters:
        - { name: propertyId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Property details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "404":
          description: Property not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /properties/{propertyId}/reviews:
    get:
      operationId: getPropertyReviews
      tags: [marketplace]
      summary: List reviews for a property
      parameters:
        - { name: propertyId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Property reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"
    post:
      operationId: createReview
      tags: [account]
      summary: Review a previously booked property
      parameters:
        - { name: propertyId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
  /recommendations:
    get:
      operationId: getRecommendations
      tags: [recommendations]
      summary: Rank available properties using user preferences
      parameters:
        - { name: guests, in: query, schema: { type: integer, minimum: 1 } }
        - { name: checkIn, in: query, schema: { type: string, format: date } }
        - { name: checkOut, in: query, schema: { type: string, format: date } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 8 } }
      responses:
        "200":
          description: Ranked properties and explanations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationResponse"
  /me:
    get:
      operationId: getMe
      tags: [account]
      summary: Get the signed-in user's profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateMe
      tags: [account]
      summary: Update the signed-in user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /preferences:
    get:
      operationId: getPreferences
      tags: [account]
      summary: Get the signed-in user's recommendation preferences
      responses:
        "200":
          description: Saved preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
    put:
      operationId: savePreferences
      tags: [account]
      summary: Save recommendation preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreferencesInput"
      responses:
        "200":
          description: Saved preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
  /wishlist:
    get:
      operationId: getWishlist
      tags: [account]
      summary: List saved properties
      responses:
        "200":
          description: Saved properties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Property"
    post:
      operationId: addWishlist
      tags: [account]
      summary: Save a property to the wishlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WishlistInput"
      responses:
        "201":
          description: Saved property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
  /wishlist/{propertyId}:
    delete:
      operationId: removeWishlist
      tags: [account]
      summary: Remove a property from the wishlist
      parameters:
        - { name: propertyId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Wishlist entry removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /bookings:
    get:
      operationId: getBookings
      tags: [account]
      summary: List the signed-in user's bookings
      responses:
        "200":
          description: User bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
    post:
      operationId: createBooking
      tags: [account]
      summary: Create a demo booking after server-side availability validation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Demo booking created; no payment was collected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "409":
          description: Dates are unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bookings/{bookingId}/cancel:
    post:
      operationId: cancelBooking
      tags: [account]
      summary: Cancel an eligible booking
      parameters:
        - { name: bookingId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Booking cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
  /host/listings:
    get:
      operationId: getHostListings
      tags: [hosting]
      summary: List the signed-in host's listings
      responses:
        "200":
          description: Host listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Property"
    post:
      operationId: createHostListing
      tags: [hosting]
      summary: Create a property listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyInput"
      responses:
        "201":
          description: Listing created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
  /host/listings/{propertyId}:
    patch:
      operationId: updateHostListing
      tags: [hosting]
      summary: Update a listing owned by the signed-in host
      parameters:
        - { name: propertyId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyUpdate"
      responses:
        "200":
          description: Listing updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
    delete:
      operationId: deleteHostListing
      tags: [hosting]
      summary: Delete a listing owned by the signed-in host
      parameters:
        - { name: propertyId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Listing deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /host/bookings:
    get:
      operationId: getHostBookings
      tags: [hosting]
      summary: List bookings for the signed-in host's listings
      responses:
        "200":
          description: Bookings associated with host listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Get platform and booking trend statistics
      responses:
        "200":
          description: Admin dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
  /admin/properties:
    get:
      operationId: getAdminProperties
      tags: [admin]
      summary: List properties for administrator review
      responses:
        "200":
          description: All properties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Property"
  /admin/properties/{propertyId}:
    delete:
      operationId: deleteAdminProperty
      tags: [admin]
      summary: Remove a property without booking history
      parameters:
        - { name: propertyId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Property removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /admin/users:
    get:
      operationId: getAdminUsers
      tags: [admin]
      summary: List users for administrator management
      responses:
        "200":
          description: Application users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
  /admin/users/{userId}/role:
    patch:
      operationId: updateUserRole
      tags: [admin]
      summary: Change a user's application role
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRoleInput"
      responses:
        "200":
          description: User role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /admin/evaluations/run:
    post:
      operationId: runEvaluation
      tags: [admin]
      summary: Run a reproducible comparison against a synthetic baseline dataset
      responses:
        "200":
          description: Evaluation metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationResult"
  /admin/evaluations/latest:
    get:
      operationId: getLatestEvaluation
      tags: [admin]
      summary: Get the latest stored research evaluation
      responses:
        "200":
          description: Latest evaluation metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationResult"
        "404":
          description: No evaluation has been run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
      required: [error]
    SuccessResponse:
      type: object
      properties:
        success: { type: boolean }
      required: [success]
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [guest, host, admin] }
        createdAt: { type: string, format: date-time }
      required: [id, name, email, role, createdAt]
    ProfileUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
    Destination:
      type: object
      properties:
        city: { type: string }
        country: { type: string }
        propertyCount: { type: integer }
        imageUrl: { type: string }
      required: [city, country, propertyCount, imageUrl]
    Property:
      type: object
      properties:
        id: { type: string }
        hostId: { type: string }
        hostName: { type: string }
        title: { type: string }
        description: { type: string }
        city: { type: string }
        country: { type: string }
        address: { type: string }
        latitude: { type: ["number", "null"] }
        longitude: { type: ["number", "null"] }
        pricePerNight: { type: number }
        propertyType: { type: string }
        maxGuests: { type: integer }
        bedrooms: { type: integer }
        bathrooms: { type: number }
        amenities: { type: array, items: { type: string } }
        imageUrls: { type: array, items: { type: string } }
        averageRating: { type: number }
        reviewCount: { type: integer }
        createdAt: { type: string, format: date-time }
      required: [id, hostId, hostName, title, description, city, country, address, latitude, longitude, pricePerNight, propertyType, maxGuests, bedrooms, bathrooms, amenities, imageUrls, averageRating, reviewCount, createdAt]
    PropertySearchResponse:
      type: object
      properties:
        properties:
          type: array
          items: { $ref: "#/components/schemas/Property" }
        total: { type: integer }
      required: [properties, total]
    HomeResponse:
      type: object
      properties:
        featured:
          type: array
          items: { $ref: "#/components/schemas/Property" }
        popularDestinations:
          type: array
          items: { $ref: "#/components/schemas/Destination" }
        recommendations:
          type: array
          items: { $ref: "#/components/schemas/RecommendationItem" }
        recommendationsAreGeneral: { type: boolean }
      required: [featured, popularDestinations, recommendations, recommendationsAreGeneral]
    RecommendationItem:
      type: object
      properties:
        property: { $ref: "#/components/schemas/Property" }
        score: { type: number }
        reasons:
          type: array
          items: { type: string }
      required: [property, score, reasons]
    RecommendationResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RecommendationItem" }
        general: { type: boolean }
        method: { type: string }
      required: [items, general, method]
    Review:
      type: object
      properties:
        id: { type: string }
        userName: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, userName, rating, comment, createdAt]
    ReviewInput:
      type: object
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, minLength: 5, maxLength: 2000 }
      required: [rating, comment]
    Preferences:
      type: object
      properties:
        preferredDestinations: { type: array, items: { type: string } }
        preferredPropertyTypes: { type: array, items: { type: string } }
        preferredAmenities: { type: array, items: { type: string } }
        budgetMin: { type: number }
        budgetMax: { type: number }
        preferredGuests: { type: integer }
      required: [preferredDestinations, preferredPropertyTypes, preferredAmenities, budgetMin, budgetMax, preferredGuests]
    PreferencesInput:
      type: object
      properties:
        preferredDestinations: { type: array, items: { type: string } }
        preferredPropertyTypes: { type: array, items: { type: string } }
        preferredAmenities: { type: array, items: { type: string } }
        budgetMin: { type: number, minimum: 0 }
        budgetMax: { type: number, minimum: 0 }
        preferredGuests: { type: integer, minimum: 1 }
      required: [preferredDestinations, preferredPropertyTypes, preferredAmenities, budgetMin, budgetMax, preferredGuests]
    WishlistInput:
      type: object
      properties:
        propertyId: { type: string }
      required: [propertyId]
    BookingInput:
      type: object
      properties:
        propertyId: { type: string }
        checkIn: { type: string, format: date }
        checkOut: { type: string, format: date }
        guests: { type: integer, minimum: 1 }
      required: [propertyId, checkIn, checkOut, guests]
    Booking:
      type: object
      properties:
        id: { type: string }
        propertyId: { type: string }
        propertyTitle: { type: string }
        city: { type: string }
        coverImage: { type: string }
        userName: { type: string }
        checkIn: { type: string, format: date }
        checkOut: { type: string, format: date }
        guests: { type: integer }
        nights: { type: integer }
        pricePerNight: { type: number }
        totalPrice: { type: number }
        status: { type: string, enum: [confirmed, cancelled, completed] }
        paymentStatus: { type: string, enum: [demo_booking] }
        createdAt: { type: string, format: date-time }
      required: [id, propertyId, propertyTitle, city, coverImage, userName, checkIn, checkOut, guests, nights, pricePerNight, totalPrice, status, paymentStatus, createdAt]
    PropertyInput:
      type: object
      properties:
        title: { type: string, minLength: 4, maxLength: 120 }
        description: { type: string, minLength: 20, maxLength: 5000 }
        city: { type: string, minLength: 2, maxLength: 100 }
        country: { type: string, minLength: 2, maxLength: 100 }
        address: { type: string, minLength: 4, maxLength: 255 }
        latitude: { type: ["number", "null"] }
        longitude: { type: ["number", "null"] }
        pricePerNight: { type: number, minimum: 1 }
        propertyType: { type: string }
        maxGuests: { type: integer, minimum: 1, maximum: 30 }
        bedrooms: { type: integer, minimum: 0, maximum: 30 }
        bathrooms: { type: number, minimum: 0, maximum: 30 }
        amenities: { type: array, items: { type: string } }
        imageUrls: { type: array, minItems: 1, items: { type: string, format: uri } }
      required: [title, description, city, country, address, pricePerNight, propertyType, maxGuests, bedrooms, bathrooms, amenities, imageUrls]
    PropertyUpdate:
      type: object
      properties:
        title: { type: string, minLength: 4, maxLength: 120 }
        description: { type: string, minLength: 20, maxLength: 5000 }
        city: { type: string, minLength: 2, maxLength: 100 }
        country: { type: string, minLength: 2, maxLength: 100 }
        address: { type: string, minLength: 4, maxLength: 255 }
        latitude: { type: ["number", "null"] }
        longitude: { type: ["number", "null"] }
        pricePerNight: { type: number, minimum: 1 }
        propertyType: { type: string }
        maxGuests: { type: integer, minimum: 1, maximum: 30 }
        bedrooms: { type: integer, minimum: 0, maximum: 30 }
        bathrooms: { type: number, minimum: 0, maximum: 30 }
        amenities: { type: array, items: { type: string } }
        imageUrls: { type: array, items: { type: string, format: uri } }
    UserRoleInput:
      type: object
      properties:
        role: { type: string, enum: [guest, host, admin] }
      required: [role]
    TrendPoint:
      type: object
      properties:
        label: { type: string }
        bookings: { type: integer }
      required: [label, bookings]
    AdminOverview:
      type: object
      properties:
        userCount: { type: integer }
        propertyCount: { type: integer }
        bookingCount: { type: integer }
        reviewCount: { type: integer }
        bookingTrend:
          type: array
          items: { $ref: "#/components/schemas/TrendPoint" }
        popularProperties:
          type: array
          items: { $ref: "#/components/schemas/Property" }
      required: [userCount, propertyCount, bookingCount, reviewCount, bookingTrend, popularProperties]
    EvaluationResult:
      type: object
      properties:
        id: { type: string }
        evaluatedAt: { type: string, format: date-time }
        syntheticData: { type: boolean }
        usersEvaluated: { type: integer }
        propertiesEvaluated: { type: integer }
        personalizedPrecisionAt5: { type: number }
        baselinePrecisionAt5: { type: number }
        personalizedNdcgAt5: { type: number }
        baselineNdcgAt5: { type: number }
        averageRecommendationMs: { type: number }
        precisionConvention: { type: string }
        relevanceScale: { type: string }
      required: [id, evaluatedAt, syntheticData, usersEvaluated, propertiesEvaluated, personalizedPrecisionAt5, baselinePrecisionAt5, personalizedNdcgAt5, baselineNdcgAt5, averageRecommendationMs, precisionConvention, relevanceScale]

